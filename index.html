<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Markdown Editor</h1>
    <div class="actions">
      <span id="stats" class="stats"></span>
      <button id="btn-copy" type="button">Copy HTML</button>
      <button id="btn-download" type="button">Download .md</button>
      <button id="btn-clear" type="button">Clear</button>
    </div>
  </header>

  <main class="columns">
    <section class="col">
      <h2>Editor <small>(.md)</small></h2>
      <textarea id="editor" spellcheck="false" placeholder="Write your markdown here..."></textarea>
    </section>

    <section class="col">
      <h2>Preview <small>(result)</small></h2>
      <article id="preview" class="preview"></article>
    </section>

    <section class="col">
      <h2>Cheatsheet <small>(click to insert)</small></h2>
      <div id="cheatsheet" class="cheatsheet"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
